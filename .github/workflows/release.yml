name: Auto Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version and compute tag
        id: version
        shell: bash
        run: |
          BASE_VER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
            NAME="AudioVault ${TAG}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VER}"
            NEW_PATCH=$(( ${PATCH:-0} + ${GITHUB_RUN_NUMBER:-1} ))
            VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
            TAG="v${VER}"
            SHORT_SHA="${GITHUB_SHA::7}"
            NAME="AudioVault v${VER} (${SHORT_SHA})"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${NAME}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build & Publish (${{ matrix.platform }})
    needs: prepare-version
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
          - platform: macos-latest
            args: "--bundles dmg,app"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            libfuse2 \
            file \
            xdg-utils \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Sync version into tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const rawVer = "${{ needs.prepare-version.outputs.version }}";
            const parts = rawVer.split(".");
            const ver = parts.slice(0, 3).join(".");

            const tauriPath = "./apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            conf.version = ver;
            fs.writeFileSync(tauriPath, JSON.stringify(conf, null, 2) + "\n");

            const cargoPath = "./Cargo.toml";
            let cargo = fs.readFileSync(cargoPath, "utf8");
            cargo = cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargo);
          '

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri Desktop App & Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare-version.outputs.tag_name }}
          releaseName: ${{ needs.prepare-version.outputs.release_name }}
          releaseBody: |
            ## 🚀 Автоматический релиз ${{ needs.prepare-version.outputs.release_name }}

            Сборка сформирована автоматически из коммита `${{ github.sha }}`.

            ### 📦 Установочные файлы
            - **Windows**: скачайте `-setup.exe` (NSIS-установщик с автоматическим созданием ярлыка на рабочем столе) или `.msi` ниже
            - **macOS**: скачайте `.dmg`
            - **Linux**: скачайте `.deb` или `.rpm`

            > Приложение **AudioVault** автоматически обнаружит этот релиз при запуске и предложит установить обновление.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
