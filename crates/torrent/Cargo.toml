[package]
name = "audiovault-torrent"
description = "Embedded BitTorrent engine (librqbit) wrapper and torrent search providers (RuTracker)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
audiovault-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
librqbit = "9"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "rustls"] }
scraper = "0.27"
encoding_rs = "0.8"
percent-encoding = "2"
async-trait = "0.1"
bytes = "1"
url = "2"

[dev-dependencies]
tempfile.workspace = true
